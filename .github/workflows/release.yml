name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:tag
          title: "chore: version packages"
          commit: "chore: version packages"
          # Don't let the action publish a GitHub Release per package. Two
          # reasons: it duplicates the single `v{version}` release the next
          # step already creates, and it posts the package's raw CHANGELOG
          # entry as the release body — which GitHub rejects above 125,000
          # characters. The 0.2.0 release absorbed a 458-changeset backlog,
          # so three of four bodies blew past that limit and failed the job
          # even though versioning and tagging had both succeeded.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          VERSION=$(echo "$PACKAGES" | jq -r '.[0].version')
          TAG="v${VERSION}"
          gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
