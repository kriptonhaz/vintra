# Shared TLS settings for all Vintra vhosts behind Cloudflare.
#
# Installed on the server at /etc/nginx/snippets/ssl-cloudflare.conf and
# `include`d from each server block (vintra.conf, api.vintra.my.id.conf).
# Replaces certbot's /etc/letsencrypt/options-ssl-nginx.conf since this
# stack uses a Cloudflare Origin Certificate, not Let's Encrypt.
#
# The cert itself lives at /etc/ssl/cloudflare/vintra.my.id.{pem,key}
# (Cloudflare → SSL/TLS → Origin Server → Create Certificate, 15-yr,
# hostnames `vintra.my.id, *.vintra.my.id`). Set the zone's SSL/TLS mode to
# "Full (strict)".

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
