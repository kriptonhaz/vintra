# JUR-185: wildcard subdomain vhost for tenant public pages.
#
# Catches `<slug>.vintra.my.id` (any slug matching the regex) and
# proxies every request to the Node app unchanged. The app's index
# route reads the Host header and decides whether to render the
# landing page or a tenant's public queue page.
#
# ─── Why no URL rewrite ──────────────────────────────────────────────
#
# An earlier version of this vhost did `rewrite ^(.*)$ /q/$sub$1` so
# the app could match an existing `/q/<slug>` route. That caused an
# SSR/CSR hydration mismatch: server rendered for `/q/<sub>`, but the
# browser URL stayed at `/`, so the client-side router tried to render
# `/` (landing page) and overrode the SSR'd queue page after a brief
# flash. Switching to Host-aware routing inside the app eliminates the
# rewrite entirely — SSR and CSR now see the same URL (`/`) and the
# same loader data, so they render the same thing.
#
# ─── Vhost specificity ───────────────────────────────────────────────
#
# nginx matches server_name by specificity:
#   1. Exact (vintra.my.id, www.vintra.my.id, api.vintra.my.id)
#   2. Wildcards starting with asterisk (none defined)
#   3. Wildcards ending with asterisk (none defined)
#   4. First matching regex (this vhost)
#   5. Default server (vintra vhost)
#
# So `<sub>.vintra.my.id` requests fall through 1-3, match this regex
# vhost on step 4. Exact hostnames defined elsewhere (the api and main
# vhosts) catch their own traffic before reaching here.
#
# ─── SSL ─────────────────────────────────────────────────────────────
#
# Wildcard cert via Cloudflare Origin Certificate (15-year, free). See
# deploy/SUBDOMAIN-DEPLOY.md for issuance + install steps.

# ─── HTTP → HTTPS redirect for wildcard ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name "~^(?<sub>[a-z0-9][a-z0-9-]{1,28}[a-z0-9])\.vintra\.my\.id$";

    return 301 https://$host$request_uri;
}

# ─── Main HTTPS wildcard server ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 directive omitted — prod nginx is 1.18 (Ubuntu 20.04 LTS)
    # which predates the standalone `http2 on;` directive (1.25+).
    # Cloudflare → origin HTTP/1.1 is fine; browser → Cloudflare gets
    # HTTP/2 + HTTP/3 from Cloudflare's edge regardless of origin.

    # Regex wrapped in double quotes so nginx doesn't interpret the
    # trailing `$` end-of-string anchor as a variable prefix (`$;`
    # would otherwise fail to parse). The `$sub` named capture is
    # available downstream but currently unused — the app reads the
    # Host header directly. Kept for documentation of the intended
    # subdomain shape.
    server_name "~^(?<sub>[a-z0-9][a-z0-9-]{1,28}[a-z0-9])\.vintra\.my\.id$";

    ssl_certificate /etc/ssl/cloudflare/vintra.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vintra.my.id.key;

    client_max_body_size 2M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        font/woff2 image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Static assets — served by nginx, same paths as main vhost ───
    # The Vite-built assets live at /_build, /assets, /images, /fonts
    # relative to the dist/client root. These paths are the same on
    # every subdomain (one app build) so we serve them directly.
    location ~* ^/(_build|assets|images|fonts)/ {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.png {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # PWA manifest — root route's __root.tsx references /manifest.json
    # in <link rel="manifest">. Without this block the request falls
    # through to Node which 404s (it's a Vite-built static file, not
    # an app route). Mirrors the main vhost's matching location.
    location = /manifest.json {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 1d;
        access_log off;
        try_files $uri =404;
    }

    # Service worker — same reasoning. no-cache so updates ship promptly
    # (browsers update SWs by reading their bytes; a cached SW pins
    # clients to the previous push handler).
    location = /sw.js {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        add_header Cache-Control "no-cache";
        access_log off;
        try_files $uri =404;
    }

    # ─── Everything else → Node (PM2 upstream pool) ───────────────────
    # The app reads the Host header server-side, detects the subdomain,
    # and renders the public queue / site page from the `/` index
    # route. No URL gymnastics; browser URL and SSR URL stay in sync.
    #
    # Routes to the vintra_backend upstream defined at the top of
    # vintra.conf (two PM2 fork apps on :3000 + :3001). nginx
    # round-robins; proxy_next_upstream auto-retries when one
    # instance is mid-restart during a rolling deploy. See the
    # matching location block in vintra.conf for the full
    # rationale.
    location / {
        proxy_pass http://vintra_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
}
