# Vintra nginx reverse proxy + static asset server.
#
# This file mirrors the production /etc/nginx/sites-available/vintra
# on the Lightsail VPS, including the SSL block. Once the Let's Encrypt
# cert is in place at /etc/letsencrypt/live/vintra.my.id/, this file
# can be cp'd onto the server and reloaded — no more accidental SSL
# wipe-outs.
#
# ─── Updating prod after editing this file ───────────────────────────
#
#   scp -i ./vintra-prod.pem deploy/nginx/vintra.conf \
#     ubuntu@15.232.90.20:/tmp/vintra.conf
#   ssh -i ./vintra-prod.pem ubuntu@15.232.90.20 \
#     "sudo mv /tmp/vintra.conf /etc/nginx/sites-available/vintra \
#       && sudo nginx -t && sudo systemctl reload nginx"
#
# ─── First-time install (run once per fresh server) ──────────────────
#
# This file references Let's Encrypt files that don't exist on a fresh
# server. To bootstrap:
#
#   1. Install nginx + certbot:
#        sudo apt install -y nginx certbot python3-certbot-nginx
#
#   2. Issue the cert with certbot's bundled nginx defaults FIRST.
#      This gets the cert files into /etc/letsencrypt/live/.../ so that
#      our config below has something to reference:
#        sudo certbot --nginx -d vintra.my.id -d www.vintra.my.id
#
#   3. NOW copy this file over (the cert paths it references exist):
#        sudo cp deploy/nginx/vintra.conf \
#          /etc/nginx/sites-available/vintra
#        sudo ln -s /etc/nginx/sites-available/vintra \
#          /etc/nginx/sites-enabled/                      # if needed
#        sudo rm /etc/nginx/sites-enabled/default          # if present
#        sudo nginx -t && sudo systemctl reload nginx
#
# ─── Cert renewal ────────────────────────────────────────────────────
#
# certbot installs a systemd timer (`certbot.timer`) that auto-renews
# every cert ≤30 days from expiry. No manual action needed unless
# something breaks.
#
# Adjust paths if the repo lives somewhere other than /home/ubuntu/prod/Vintra.

# ─── Upstream pool: two PM2 fork apps for zero-downtime deploys ──────
#
# vintra-web-a on :3000 and vintra-web-b on :3001 (defined in
# repo-root ecosystem.config.cjs). nginx round-robins between them by
# default. During a rolling deploy, when one instance is restarting
# (briefly refusing connections), `proxy_next_upstream` in each
# location below silently retries against the other — visitors see
# no failure.
#
# max_fails=2 fail_timeout=3s: nginx considers an upstream "down"
# after 2 failed attempts within 3 seconds and stops routing to it
# for 3 seconds. Short window matches our deploy cadence (a single
# instance restart is <2s); long enough not to flap on transient
# blips.
#
# keepalive 16: persistent connection pool from nginx to each
# upstream. Cuts ~10ms per request by avoiding TCP handshake +
# Node http.Server's per-connection setup.
#
# Shared across this vhost AND public-tenant.conf (nginx upstream
# blocks are global within the http {} context). Keeping the block
# in vintra.conf because that's the "primary" web vhost; if we
# ever split, move it to a dedicated /etc/nginx/conf.d/upstream.conf.
upstream vintra_backend {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=3s;
    keepalive 16;
}

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────
# Anything coming in on plain HTTP gets bounced to the HTTPS host.
# Required for Let's Encrypt's HTTP-01 challenge to keep working
# during cert renewals (certbot.timer adds a temporary location
# during renewal).
server {
    listen 80;
    listen [::]:80;
    server_name vintra.my.id www.vintra.my.id;

    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ───────────────────────────────────────────────
server {
    # http2 directive omitted — prod nginx is 1.18 (Ubuntu 20.04 LTS)
    # which predates the standalone `http2 on;` syntax (1.25+).
    # Cloudflare → origin HTTP/1.1 is fine for our traffic shape;
    # browser → Cloudflare gets HTTP/2 + HTTP/3 from CF's edge
    # regardless of what we negotiate at origin.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vintra.my.id www.vintra.my.id;

    # SSL — Cloudflare Origin Certificate (15-yr, covers vintra.my.id +
    # *.vintra.my.id, so apex/www/api/tenant all share one cert). The
    # browser↔Cloudflare leg uses CF's universal SSL; Cloudflare↔origin
    # uses these files (set SSL/TLS mode to "Full (strict)"). Install:
    # see deploy/nginx/README or paste into /etc/ssl/cloudflare/.
    ssl_certificate /etc/ssl/cloudflare/vintra.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vintra.my.id.key;
    include /etc/nginx/snippets/ssl-cloudflare.conf;

    # Photo uploads from staff selfies are compressed client-side to ~500KB,
    # but allow some headroom.
    client_max_body_size 2M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff2
        image/svg+xml;

    # Hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Static assets — served by nginx, never hit Node ─────────────
    # Vite emits hashed filenames so we can cache them aggressively.
    location ~* ^/(_build|assets|images|fonts)/ {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Common static files at the root (favicon variants, robots.txt,
    # service worker, manifest). All live in apps/web/public and end
    # up at the root of dist/client after Vite build.
    #
    # NOTE: /sw.js MUST be served from this exact path with no caching
    # — service workers update by reading their own bytes, and a
    # cached SW means clients get stuck on an old push handler. Hence
    # the Cache-Control: no-cache override below.
    location = /favicon.ico {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.png {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /robots.txt {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /manifest.json {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        expires 1d;
        access_log off;
        try_files $uri =404;
    }
    location = /sw.js {
        root /home/ubuntu/prod/Vintra/apps/web/dist/client;
        add_header Cache-Control "no-cache";
        access_log off;
        try_files $uri =404;
    }

    # ─── Everything else → Node (PM2 upstream pool) ───────────────────
    #
    # Routes to the vintra_backend upstream block defined at the
    # top of this file (two PM2 fork apps on :3000 + :3001).
    #
    # proxy_next_upstream: when one upstream returns a connection
    # error, timeout, or a 5xx, nginx automatically retries against
    # the OTHER upstream. This is what makes deploys zero-downtime —
    # the instance being restarted briefly refuses connections,
    # nginx silently retries against the still-running sibling.
    # Idempotency note: we limit to safe-to-retry conditions
    # (network errors + 502/503/504) and to one extra try; this is
    # by default only safe for idempotent methods (GET/HEAD) per
    # nginx docs, but `non_idempotent` adds POST too — we accept
    # that because our writes are themselves idempotent (Drizzle
    # upserts, slug claims with uniqueness checks, etc.) and a
    # half-failed POST being retried is preferable to a 520 at the
    # edge.
    location / {
        proxy_pass http://vintra_backend;
        proxy_http_version 1.1;
        # keepalive in the upstream block requires HTTP/1.1 + this
        # header reset (nginx default sends "close" otherwise).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;            # streaming SSR + server-sent events
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # The SSR HTML shell + server-function responses must never be
        # heuristically cached by the browser. A stale shell points at
        # content-hashed JS chunks that the next deploy deletes — the
        # browser then 404s on a missing chunk and renders a blank page
        # until the user manually clears their cache. `no-cache` forces
        # revalidation on every visit, so the shell always references
        # chunks that exist. (Hashed assets stay long-cached + immutable
        # via the /assets/ location above — their names change per build.)
        add_header Cache-Control "no-cache" always;
        # nginx add_header does not merge across levels: declaring one
        # here stops this location inheriting the server-block security
        # headers, so they must be repeated.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
