# Vintra WhatsApp API — nginx reverse proxy for api.vintra.my.id.
#
# Sibling to deploy/nginx/vintra.conf (the web site). Same Lightsail
# VPS, separate server block + separate Let's Encrypt cert.
#
# ─── First-time install (after the web site is already up) ────────────
#
# 1. Add the DNS A record for api.vintra.my.id pointing to the same VPS
#    IP (15.232.90.20). Wait for propagation:
#      dig +short api.vintra.my.id A
#
# 2. Issue the cert via certbot — let it modify a temporary minimal
#    config so the HTTP-01 challenge can succeed:
#      sudo certbot --nginx -d api.vintra.my.id
#
# 3. THEN copy this file (it references certbot-managed cert paths):
#      sudo cp deploy/nginx/api.vintra.my.id.conf \
#        /etc/nginx/sites-available/api.vintra.my.id
#      sudo ln -s /etc/nginx/sites-available/api.vintra.my.id \
#        /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# Renewal is automatic via certbot.timer.
#
# ─── Updating prod after editing this file ────────────────────────────
#
#   scp -i ./vintra-prod.pem deploy/nginx/api.vintra.my.id.conf \
#     ubuntu@15.232.90.20:/tmp/api.vintra.my.id.conf
#   ssh -i ./vintra-prod.pem ubuntu@15.232.90.20 \
#     "sudo mv /tmp/api.vintra.my.id.conf /etc/nginx/sites-available/api.vintra.my.id \
#       && sudo nginx -t && sudo systemctl reload nginx"

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────
server {
    listen 80;
    server_name api.vintra.my.id;

    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ───────────────────────────────────────────────
server {
    # http2 lives on the listen line — older nginx (1.18 on Ubuntu
    # 22.04) doesn't support standalone `http2 on;`. Drop the IPv6
    # listen since this box doesn't have IPv6 enabled (Lightsail).
    listen 443 ssl http2;
    server_name api.vintra.my.id;

    # Cloudflare Origin Certificate — the same vintra.my.id + *.vintra.my.id
    # cert as the web vhost (*.vintra.my.id matches api.vintra.my.id).
    ssl_certificate /etc/ssl/cloudflare/vintra.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vintra.my.id.key;
    include /etc/nginx/snippets/ssl-cloudflare.conf;

    # The api accepts the web app uploading outbound WhatsApp images
    # via S3-key pointers (small JSON), but inbound webhooks (none
    # today) and future media-proxy endpoints might post larger
    # payloads. Keep modestly above the web site's 2M.
    client_max_body_size 10M;

    # Tight CORS — the only legitimate browser caller is the Vintra
    # web app server-side (which talks api-to-api), so locking this
    # down to known origins is fine. Adjust if you ever expose the api
    # to third-party clients.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression — JSON responses (RAG payloads, message lists)
    # compress well over the wire.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json;

    # ─── Health endpoints ─────────────────────────────────────────────
    # /healthz + /readyz hit no DB; let monitoring scrape without
    # cluttering the access log.
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:4099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Everything else → Go API (Fiber on :4099) ───────────────────
    location / {
        proxy_pass http://127.0.0.1:4099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers. The api doesn't expose WS yet but
        # the QR-pairing SSE flow benefits from connection upgrade
        # handling, and any future WebSocket endpoint won't need a
        # nginx change.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI replies can take 5-15s when DeepSeek is slow + RAG runs.
        # Be generous on timeouts but cap so a stuck upstream eventually
        # fails the request rather than hanging the client forever.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Streaming responses (future SSE endpoint for live message
        # events) — disable buffering so events flush immediately.
        proxy_buffering off;
    }
}
