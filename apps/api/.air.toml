# air hot-reload config — https://github.com/air-verse/air
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["bin", "tmp", "data", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  kill_delay = "500ms"
  send_interrupt = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
